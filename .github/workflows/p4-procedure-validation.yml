# TEMPORARY - validates the Macro item 1 / P4 Windows procedure on real Windows runners.
# Runs only on pushes to this session branch that touch the procedure or this file.
# It will be removed from the branch once the validation results are recorded.
# The procedure itself clones ramkivs/iips-review-recovered@main; this checkout only supplies the script.
name: P4 procedure validation (temporary)

on:
  push:
    branches:
      - arena/19bea276-iips-review-recovered
    paths:
      - 'evidence/integration/mospi-nas-p4-live-verification-2026-10-15/run-p4-nas-live-verification.ps1'
      - '.github/workflows/p4-procedure-validation.yml'

permissions:
  contents: read
  checks: write

concurrency:
  group: p4-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ps51-live
            ps: powershell.exe
            blocked: false
          - name: ps7-live
            ps: pwsh.exe
            blocked: false
          - name: ps51-provider-blocked
            ps: powershell.exe
            blocked: true
    steps:
      - name: Check out the session branch (script only)
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Negative scenario - make api.mospi.gov.in unreachable (hosts file)
        if: ${{ matrix.blocked }}
        shell: powershell
        run: |
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`r`n127.0.0.1 api.mospi.gov.in"
          ipconfig /flushdns | Out-Null
          Write-Host ([System.Net.Dns]::GetHostAddresses('api.mospi.gov.in') -join ', ')

      - name: Run the procedure exactly as an operator would
        id: run
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'evidence\integration\mospi-nas-p4-live-verification-2026-10-15\run-p4-nas-live-verification.ps1'
          $root = Join-Path $env:RUNNER_TEMP 'p4'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          & '${{ matrix.ps }}' -NoProfile -ExecutionPolicy Bypass -File $script -WorkRoot $root
          $code = $LASTEXITCODE
          Write-Host "procedure exit code: $code"
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          Write-Host 'node processes still running after the procedure:'
          Get-Process node -ErrorAction SilentlyContinue | Format-Table Id, StartTime -AutoSize | Out-String | Write-Host
          Write-Host 'listeners on 8788 after the procedure:'
          Get-NetTCPConnection -LocalPort 8788 -State Listen -ErrorAction SilentlyContinue | Out-String | Write-Host
          Write-Host 'run folders left behind:'
          Get-ChildItem $root -Directory | ForEach-Object { $_.FullName; Get-ChildItem $_.FullName | ForEach-Object { '   ' + $_.Name } } | Out-String | Write-Host
          exit 0

      - name: Setup-failure scenario - port already in use must give NOT RUN (exit 2)
        if: ${{ matrix.blocked }}
        id: portcheck
        shell: powershell
        run: |
          $listener = New-Object System.Net.Sockets.TcpListener ([System.Net.IPAddress]::Loopback), 8788
          $listener.Start()
          $script = Join-Path $env:GITHUB_WORKSPACE 'evidence\integration\mospi-nas-p4-live-verification-2026-10-15\run-p4-nas-live-verification.ps1'
          $root = Join-Path $env:RUNNER_TEMP 'p4-port'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -WorkRoot $root
          $code = $LASTEXITCODE
          $listener.Stop()
          Write-Host "procedure exit code: $code"
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          exit 0

      - name: Publish result files as check runs (readable through the REST API)
        if: ${{ always() }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Publish-Result([string]$Label, [string]$Root, [string]$Code) {
            $file = Get-ChildItem -Path $Root -Filter 'P4-NAS-RESULT.txt' -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
            $text = 'no result file found under ' + $Root
            if ($file) { $text = [System.IO.File]::ReadAllText($file.FullName) }
            if ($text.Length -gt 65000) { $text = $text.Substring($text.Length - 65000) }
            $verdict = 'unknown'
            $m = [regex]::Match($text, 'P4 RESULT: ([A-Z ]+?)  -')
            if ($m.Success) { $verdict = $m.Groups[1].Value }
            $payload = @{
              name = 'P4 procedure validation / ' + $Label
              head_sha = '${{ github.sha }}'
              status = 'completed'
              conclusion = 'neutral'
              output = @{
                title = $Label + ' : exit ' + $Code + ' : ' + $verdict
                summary = 'procedure exit code ' + $Code + '; verdict ' + $verdict + '; host ${{ matrix.ps }} on ${{ runner.os }}'
                text = $text
              }
            }
            $path = Join-Path $env:RUNNER_TEMP ('payload-' + $Label + '.json')
            [System.IO.File]::WriteAllText($path, ($payload | ConvertTo-Json -Depth 5), (New-Object System.Text.UTF8Encoding $false))
            gh api "repos/${{ github.repository }}/check-runs" --method POST --input $path --silent
            Write-Host ('published: ' + $Label + ' exit ' + $Code + ' verdict ' + $verdict)
          }
          Publish-Result '${{ matrix.name }}' (Join-Path $env:RUNNER_TEMP 'p4') '${{ steps.run.outputs.exit_code }}'
          if ('${{ matrix.blocked }}' -eq 'true') {
            Publish-Result '${{ matrix.name }}-port-in-use' (Join-Path $env:RUNNER_TEMP 'p4-port') '${{ steps.portcheck.outputs.exit_code }}'
          }
