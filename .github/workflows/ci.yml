# IRR continuous verification — work item `CV-42` (tracker:
# `IIPS_V3_E2E_MASTER_TRACKER_AND_IRR_IPD_DECISION_REGISTER_2026-10-13.md`, §16.4 / §16.18).
#
# SCOPE — the IRR `frontend/` package, plus the explicitly authorized Stage A scoped replay-server
# import-closure typecheck. It retains the three checks this program's validation
# evidence already rests on (`V2` typecheck, `V3` full Vitest suite, `V4` production build) plus a
# zero-test guard, exactly as `CV-42` authorizes ("a workflow file is a repository change, so its
# creation needs the ordinary main-admission route": this file therefore travels as a PR and its
# checks must be visible on GitHub). Deliberately NOT included:
#   • standalone `iips-platform` checks — its transitive imports in the replay-server closure are
#     typechecked, but its own typecheck, test and integration suites are not run by this workflow.
#   • the IPD repository — its CI sits behind the §20 Stage 3 `P2`/`P3` admission act (that is `CV-42`'s
#     second half and stays outside this change).
#   • any deployment, publish, environment, credential, status-check or enterprise control. A green
#     run here means "the established checks passed"; it is not qualification, admission or release.
#
# WHAT A GREEN JOB DOES *NOT* MEAN: `frontend/tsconfig.json` includes `src` + `vite.config.ts`, so the
# default typecheck covers the client. The separate Stage A strict check covers the actual replay
# server composition/import closure and the authorized changed/new server tests. Other server files
# outside that closure are tested/transformed, not asserted to be typechecked or qualified.
name: CI

# IMPORTANT DEPENDENCY BOUNDARY: `npm ci` resolves three frontend dependencies pinned to the
# private `ramkivs/iips-production-market-data` repository. This product CI is therefore limited
# to frontend code and the test guard. IRR-only documentation, governance, script and validator
# changes are covered by `cap03-revision7-irr-static.yml`; do not add those paths here.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.ci/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.ci/**'
      - '.github/workflows/ci.yml'

# Read-only: this workflow verifies, it never writes to the repository, an environment or a release.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the exact commit under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The repository declares no `engines` and no `packageManager`, and its lockfile is
      # lockfileVersion 3. Node 22 + npm 10 is the toolchain the recorded local evidence (V2–V4) was
      # produced with, so CI pins that major pair instead of inventing a new one.
      - name: Set up Node 22 / npm 10 with the lockfile-keyed cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Mint an installation token scoped to the one private dependency repository. It has
      # Contents read-only access. The token is used only by the private-repository read check
      # and npm ci, through step-local environment variables; it is never persisted to Git config,
      # the checkout, or an artifact.
      - name: Create read-only IPD installation token
        id: ipd-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IRR_IPD_APP_CLIENT_ID }}
          private-key: ${{ secrets.IRR_IPD_APP_PRIVATE_KEY }}
          owner: ramkivs
          repositories: iips-production-market-data
          permission-contents: read

      - name: Verify the scoped token can read the private IPD repository
        env:
          GH_TOKEN: ${{ steps.ipd-token.outputs.token }}
        run: |
          test "$(gh api repos/ramkivs/iips-production-market-data --jq '.private')" = true
          echo 'Verified the scoped token reads a private IPD repository.'

      # The lockfile records git+ssh URLs. npm normalizes those to SSH URLs before invoking Git;
      # cover both the recorded and normalized forms, plus scp-style GitHub URLs. Generate the
      # Basic authorization header in-process; only the exact IPD repository path receives it.
      - name: Install dependencies from the committed lockfile
        env:
          IPD_APP_TOKEN: ${{ steps.ipd-token.outputs.token }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: git+ssh://git@github.com/
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/
          GIT_CONFIG_KEY_2: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_2: 'git@github.com:'
          GIT_CONFIG_KEY_3: http.https://github.com/ramkivs/iips-production-market-data.git/.extraheader
        run: |
          AUTH_B64="$(printf 'x-access-token:%s' "$IPD_APP_TOKEN" | base64 -w0)"
          echo "::add-mask::$IPD_APP_TOKEN"
          echo "::add-mask::$AUTH_B64"
          export GIT_CONFIG_VALUE_3="AUTHORIZATION: basic $AUTH_B64"

          npm_log="$(mktemp)"
          set +e
          npm ci --no-audit --no-fund --loglevel=verbose >"$npm_log" 2>&1
          npm_status=$?
          set -e

          npm_output="$(cat "$npm_log")"
          npm_output="${npm_output//"$IPD_APP_TOKEN"/[REDACTED]}"
          npm_output="${npm_output//"$AUTH_B64"/[REDACTED]}"
          printf '%s\n' "$npm_output"
          if [[ "$npm_status" -ne 0 ]]; then
            error_text="$(tail -n 15 "$npm_log")"
            error_text="${error_text//"$IPD_APP_TOKEN"/[REDACTED]}"
            error_text="${error_text//"$AUTH_B64"/[REDACTED]}"
            error_text="${error_text//'%'/'%25'}"
            error_text="${error_text//$'\r'/'%0D'}"
            error_text="${error_text//$'\n'/'%0A'}"
            echo "::error title=npm ci failed::$error_text"
            exit "$npm_status"
          fi

      - name: Verify all private dependencies resolve to their committed pins
        run: node ../.ci/verify-ipd-pins.mjs

      # `frontend/package.json` → "typecheck": "tsc --noEmit" (the established script; no substitution).
      - name: Typecheck
        run: npm run typecheck

      - name: Strict governed Screen replay server import closure
        run: npm run typecheck:replay-server

      # `test:ci` runs the identical `vitest run` suite and additionally emits the JSON summary the
      # guard reads. `npm test` itself is left untouched, so local behaviour does not change.
      # No `continue-on-error`, no `|| true`, no `--passWithNoTests`: any non-zero exit fails the job.
      - name: Run the full Vitest suite
        run: npm run test:ci

      # Fails when 0 tests were discovered, when the report is missing or malformed, when
      # `success` is not true, or when any test failed — i.e. the CV-35 false-green class cannot pass.
      - name: Assert a non-zero, fully passing test run
        run: node .ci/assert-tests.js .vitest-report.json

      # `frontend/package.json` → "build": "tsc -b && vite build" (the established production build).
      - name: Production build
        run: npm run build
