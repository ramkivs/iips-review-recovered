# TEMPORARY work-item harness — WI-6A-S2 consolidated page recovery.
#
# Purpose: obtain the *actual bytes* of two issuer/exchange annual-report PDFs and
# extract their complete per-page text, because the investigation environment has no
# PDF tooling and no general egress. The runner has both.
#
# Output policy: it writes ONLY the extracted candidate pages (small text files) into
# `evidence/real-issuer/WI6A-S2-CONSOLIDATED-PAGE-RECOVERY-2026-11-07/source/_runner/`
# and commits them back to the same branch so the investigating environment can read
# them through git. It never writes product code, never runs tests, never deploys.
#
# This file is removed from the branch once the evidence is captured.
name: TEMP AR page recovery (WI-6A-S2)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -v 2>&1 | head -2
      - name: Fetch PDFs
        run: |
          mkdir -p out
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          fetch() {
            name="$1"; url="$2"
            code=$(curl -sS -L --max-time 240 -A "$UA" -o "out/$name.pdf" -w '%{http_code}' "$url" 2>out/$name.curl.err || echo ERR)
            magic=$(head -c 4 "out/$name.pdf" 2>/dev/null | tr -d '\0')
            size=$(stat -c%s "out/$name.pdf" 2>/dev/null || echo 0)
            sha=$(sha256sum "out/$name.pdf" 2>/dev/null | cut -d' ' -f1)
            eb=$(head -c 300 "out/$name.curl.err" 2>/dev/null | tr '\n' ' ')
            echo "$name|http=$code|bytes=$size|sha256=$sha|magic=$magic|url=$url|err=$eb" >> out/fetch-log.txt
          }
          fetch fy24_rpg 'https://www.rpggroup.com/assets/investors/pdfs/zensar-annual-report-fy241743584822.pdf'
          fetch fy23_bse 'https://www.bseindia.com/xml-data/corpfiling/AttachHis/f1a251aa-69c1-4a16-baad-67c3b12cde24.pdf'
          fetch fy23_wayback 'https://web.archive.org/web/20250803083822id_/https://www.bseindia.com/xml-data/corpfiling/AttachHis/f1a251aa-69c1-4a16-baad-67c3b12cde24.pdf'
          cat out/fetch-log.txt
      - name: Write splitter
        run: |
          cat > /tmp/split.py <<'PY'
          import sys, re
          base = sys.argv[1]
          txt = open(base + ".layout.txt", encoding="utf-8", errors="replace").read()
          pages = txt.split("\f")
          def flat(s):
              return re.sub(r"\s+", " ", s).strip()
          with open(base + ".pages.txt", "w", encoding="utf-8") as g:
              for i, p in enumerate(pages, start=1):
                  g.write("\n<<<PDF_PAGE %d>>>\n" % i)
                  g.write(p.rstrip("\n") + "\n")
          with open(base + ".page-index.txt", "w", encoding="utf-8") as ix:
              for i, p in enumerate(pages, start=1):
                  ix.write("p%d\tchars=%d\t%s\n" % (i, len(flat(p)), flat(p)[:110]))
          keys = ("outstanding borrowing", "lease liabilit", "financial instrument",
                  "note 27", "note 28", "borrowings", "capital management")
          hits = []
          for i, p in enumerate(pages, start=1):
              low = p.lower()
              matched = [k for k in keys if k in low]
              if matched:
                  hits.append((i, matched))
          with open(base + ".hits.txt", "w", encoding="utf-8") as h:
              for i, matched in hits:
                  h.write("PDF_PAGE %d  keys=%s\n" % (i, ",".join(matched)))
          print(base, "pages:", len(pages), "hits:", len(hits))
          PY
      - name: Extract per-page text
        run: |
          cd out
          for f in *.pdf; do
            base="${f%.pdf}"
            if [ "$(head -c 4 "$f" | tr -d '\0')" != "%PDF" ]; then
              echo "SKIP $base (not a PDF)" >> extract-log.txt
              continue
            fi
            pdfinfo "$f" > "$base.pdfinfo.txt" 2>&1 || true
            pdftotext -layout "$f" "$base.layout.txt" 2>> extract-log.txt || true
            python3 /tmp/split.py "$base" >> extract-log.txt 2>&1 || true
          done
          ls -l
      - name: Select candidate pages
        run: |
          cat > /tmp/select.py <<'PY'
          import sys, os, glob, re
          dest = "evidence/real-issuer/WI6A-S2-CONSOLIDATED-PAGE-RECOVERY-2026-11-07/source/_runner"
          os.makedirs(dest, exist_ok=True)
          for path in sorted(glob.glob("out/*.layout.txt")):
              base = os.path.basename(path)[:-len(".layout.txt")]
              pdf = "out/%s.pdf" % base
              if open(pdf, "rb").read(4)[:4] != b"%PDF":
                  continue
              pages = open(path, encoding="utf-8", errors="replace").read().split("\f")
              keys = ("outstanding borrowing", "lease liabilit", "financial instrument",
                      "note 27", "borrowings", "capital management")
              keep = set()
              for i, p in enumerate(pages, start=1):
                  if any(k in p.lower() for k in keys):
                      keep.update((i, i + 1))
              bands = {"fy24_rpg": [(128, 132), (139, 148)],
                       "fy23_bse": [(136, 141), (147, 158)]}
              for lo, hi in bands.get(base, []):
                  keep.update(range(lo, hi + 1))
              keep = sorted(k for k in keep if 1 <= k <= len(pages))
              with open("%s/%s.selected-pages.txt" % (dest, base), "w", encoding="utf-8") as g:
                  for i in keep:
                      g.write("\n<<<PDF_PAGE %d of %d>>>\n" % (i, len(pages)))
                      g.write(pages[i - 1].rstrip("\n") + "\n")
              print(base, "selected", len(keep), "pages")
          PY
          python3 /tmp/select.py
          D=evidence/real-issuer/WI6A-S2-CONSOLIDATED-PAGE-RECOVERY-2026-11-07/source/_runner
          cp out/*.page-index.txt out/*.hits.txt out/*.pdfinfo.txt out/fetch-log.txt out/extract-log.txt "$D"/ 2>/dev/null || true
          ls -l evidence/real-issuer/WI6A-S2-CONSOLIDATED-PAGE-RECOVERY-2026-11-07/source/_runner/
      - name: Commit extracted pages back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/real-issuer/WI6A-S2-CONSOLIDATED-PAGE-RECOVERY-2026-11-07/source/_runner
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "WI-6A-S2: captured annual-report page text (temporary extraction harness)"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload extracted text
        uses: actions/upload-artifact@v4
        with:
          name: ar-pages
          path: out/
          if-no-files-found: warn
          retention-days: 3
