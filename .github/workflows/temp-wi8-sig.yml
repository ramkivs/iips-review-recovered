name: temp-wi8-sig
on:
  push:
    branches: [arena/60fea33a-iips-review-recovered]
    paths: ['.github/workflows/temp-wi8-sig.yml']
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: fetch and extract the auditor signature pages
        run: |
          mkdir -p evidence/real-issuer/_wi8-sig
          curl -sS -o ar26.pdf https://www.kecrpg.com/public/media/annualReportMedia/KEC_Annual_Report_2025-26.pdf
          echo "sha256: $(sha256sum ar26.pdf | cut -d' ' -f1)" >> evidence/real-issuer/_wi8-sig/summary.txt
          for p in 112 113 114 115 116; do
            pdftotext -layout -f $p -l $p ar26.pdf evidence/real-issuer/_wi8-sig/p$p.txt
            echo "== page $p: $(grep -c 'Price Waterhouse' evidence/real-issuer/_wi8-sig/p$p.txt) hits for Price Waterhouse; $(grep -c 'FRN' evidence/real-issuer/_wi8-sig/p$p.txt) hits for FRN; $(grep -c 'Sumit Seth' evidence/real-issuer/_wi8-sig/p$p.txt) hits for Sumit Seth" >> evidence/real-issuer/_wi8-sig/summary.txt
          done
          cat evidence/real-issuer/_wi8-sig/summary.txt
      - name: commit back
        run: |
          git config user.name "wi8-sig"
          git config user.email "wi8-sig@users.noreply.github.com"
          git add evidence/real-issuer/_wi8-sig
          git commit -m "WI-8: temp auditor signature page extraction"
          git push
