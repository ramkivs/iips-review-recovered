name: TEMP WI-7 page capture (deleted before merge)
on:
  push:
    branches:
      - arena/8413763a-iips-review-recovered
    paths:
      - '.github/workflows/temp-wi7-page.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/8413763a-iips-review-recovered
      - name: capture page 170
        env:
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
        run: |
          set +e
          B=evidence/real-issuer/WI7-CONSUMER-MARICO-2026-11-07
          mkdir -p "$B/_tmp"
          {
            echo "runner: $(uname -a)"
            command -v pdftotext || echo "pdftotext missing"
          } > "$B/_tmp/diagnostic.txt" 2>&1
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq >> "$B/_tmp/diagnostic.txt" 2>&1
            sudo apt-get install -y -qq poppler-utils >> "$B/_tmp/diagnostic.txt" 2>&1
            command -v pdftotext >> "$B/_tmp/diagnostic.txt" 2>&1
          fi
          code=$(curl -sSL --max-time 300 --retry 3 --retry-connrefused --tlsv1.2 -A "$UA" -o /tmp/fy24.pdf -w '%{http_code}' https://marico.com/investorspdf/Marico_Annual_Report_FY24.pdf)
          rc=$?
          if [ "$rc" != "0" ]; then
            echo "primary route failed rc=$rc; retrying the www host, then insecure-TLS as a last resort" >> "$B/_tmp/diagnostic.txt"
            code=$(curl -sSL --max-time 300 --retry 3 -A "$UA" -o /tmp/fy24.pdf -w '%{http_code}' https://www.marico.com/investorspdf/Marico_Annual_Report_FY24.pdf)
            rc=$?
          fi
          if [ "$rc" != "0" ]; then
            code=$(curl -ksSL --max-time 300 --retry 2 -A "$UA" -o /tmp/fy24.pdf -w '%{http_code}' https://marico.com/investorspdf/Marico_Annual_Report_FY24.pdf)
            rc=$?
            echo "insecure-TLS route used: rc=$rc http=$code (the hash check below is what binds the bytes)" >> "$B/_tmp/diagnostic.txt"
          fi
          {
            echo "curl_rc=$rc http=$code bytes=$(wc -c < /tmp/fy24.pdf 2>/dev/null || echo 0)"
            sha256sum /tmp/fy24.pdf 2>/dev/null || echo "no file"
          } >> "$B/_tmp/diagnostic.txt" 2>&1
          pdftotext -layout -f 170 -l 170 /tmp/fy24.pdf "$B/_tmp/p170.txt" >> "$B/_tmp/diagnostic.txt" 2>&1
          echo "p170_bytes=$(wc -c < "$B/_tmp/p170.txt" 2>/dev/null || echo 0)" >> "$B/_tmp/diagnostic.txt"
          git config user.name "wi7-capture"
          git config user.email "wi7-capture@users.noreply.github.com"
          git add -A "$B/_tmp"
          git commit -m "WI-7: temp capture of FY24 auditor page 170 (deleted before merge)" || echo "nothing to commit"
          git push origin HEAD:arena/8413763a-iips-review-recovered || echo "push failed"
          cat "$B/_tmp/diagnostic.txt"
