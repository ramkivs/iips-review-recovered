name: temp L-039 template-zero evidence (throwaway — deleted before PR)

# THROWAWAY. Final evidence pass for L-039, on a runner.
#
# Pass 5 found that the NSE XBRL instance for the AUDITED period ended 31-MAR-2026 (consolidated) tags
# in-capmkt:CurrentInvestments = 0, and that the rendered Inline-XBRL prints "Current investments 0.00" — while
# the audited PDF statement of the same filing prints no such caption at all (four current financial-asset
# captions only). This pass establishes whether that zero is an affirmative disclosure or the taxonomy template
# completing a caption the issuer does not present, by printing, from the same audited instance:
#   * the complete rendered balance-sheet section,
#   * every balance-sheet element with its value,
#   * which of those captions appear in the audited PDF and which do not.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-l039-newdiscovery.yml'

permissions:
  contents: write

jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/7bc5125b-iips-review-recovered

      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils curl >/dev/null

      - name: Collect report into /tmp/l039-report6.txt
        run: |
          set -u
          REPORT=/tmp/l039-report6.txt
          : > "$REPORT"
          exec 3>&1
          exec >> "$REPORT" 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          REF="https://www.nseindia.com/"
          IX="https://nsearchives.nseindia.com/corporate/ixbrl/INTEGRATED_FILING_INDAS_158430_16052026225416_iXBRL_WEB.html"
          XB="https://nsearchives.nseindia.com/corporate/xbrl/INTEGRATED_FILING_INDAS_1668450_16052026105416_WEB.xml"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -sS -A "$UA" -o /tmp/ix.html -w 'ixbrl http=%{http_code} bytes=%{size_download}\n' --max-time 180 "$IX"
          echo "ixbrl sha256=$(sha256sum /tmp/ix.html | cut -d' ' -f1)"
          curl -sS -A "$UA" -o /tmp/inst.xml -w 'xbrl  http=%{http_code} bytes=%{size_download}\n' --max-time 180 "$XB"
          echo "xbrl  sha256=$(sha256sum /tmp/inst.xml | cut -d' ' -f1)"

          echo
          echo "===== SECTION A: rendered Inline-XBRL — the balance-sheet section as the exchange publishes it ====="
          python3 -c "import re;t=open('/tmp/ix.html',errors='ignore').read();txt=re.sub(r'<script.*?</script>',' ',t,flags=re.S);txt=re.sub(r'<[^>]+>','\n',txt);lines=[re.sub(r'\s+',' ',l).strip() for l in txt.split('\n')];lines=[l for l in lines if l];s=[i for i,l in enumerate(lines) if 'ASSETS'==l.upper() or l.upper().startswith('ASSETS')];e=[i for i,l in enumerate(lines) if 'Total Equity and Liabilities' in l];start=s[0] if s else 0;end=(e[-1] if e else min(len(lines),start+400));print('\n'.join(lines[start:end+2]))" 2>/dev/null | head -140

          echo
          echo "===== SECTION B: every investment-related and zero-valued balance-sheet element in the instance ====="
          python3 -c "import re;t=open('/tmp/inst.xml',errors='ignore').read();facts=[(m.group(1),m.group(2).strip(),(m.group(0)[:160])) for m in re.finditer(r'<([A-Za-z][A-Za-z0-9_:.\-]*)[^>]*>([^<]*)<',t)];inv=[f for f in facts if re.search(r'(?i)invest|loans|receivables|inventor|cash',f[0])];print('matching elements=',len(inv));[print(' ',n,'=',v) for n,v,_ in inv[:60]]" 2>/dev/null

          echo
          echo "===== SECTION C: how many distinct balance-sheet elements carry 0, and do those captions print in the audited PDF? ====="
          python3 -c "import re;t=open('/tmp/inst.xml',errors='ignore').read();facts=[(m.group(1).split(':')[-1],m.group(2).strip()) for m in re.finditer(r'<([A-Za-z][A-Za-z0-9_:.\-]*)[^>]*>([^<]*)<',t)];bs=[(n,v) for n,v in facts if re.match(r'(?i)(current|noncurrent|trade|loans|cash|bank|inventor|investment|other)',n)];zeros=[(n,v) for n,v in bs if v in ('0','0.0','0.00')];print('balance-sheet-ish elements=',len(bs),' of which zero=',len(zeros));[print('   ZERO',n) for n,_ in sorted(zeros)[:40]]" 2>/dev/null

          echo
          echo "===== SECTION D: the audited PDF statement — captions actually printed (control) ====="
          curl -sSL -A "$UA" -H "Referer: $REF" -o /tmp/fy26.pdf --max-time 240 "https://nsearchives.nseindia.com/corporate/KEC_16052026215722_SEintimationFinancials.pdf"
          echo "pdf sha256=$(sha256sum /tmp/fy26.pdf | cut -d' ' -f1) pages=$(pdfinfo /tmp/fy26.pdf | awk '/^Pages:/{print $2}')"
          pdftotext -layout -f 9 -l 9 /tmp/fy26.pdf - | grep -nE "\(i\)|\(ii\)|\(iii\)|\(iv\)|Investments|Loans|Trade receivables|Cash|Bank|Inventories" | cut -c1-150

          echo
          echo "===== END OF REPORT ====="
          exec >&3 2>&3
          echo "report bytes=$(stat -c%s "$REPORT")"

      - name: Publish report to the branch (temp path)
        if: always()
        run: |
          set -u
          REPORT=/tmp/l039-report6.txt
          [ -s "$REPORT" ] || { echo "no report captured"; exit 0; }
          mkdir -p .l039-temp
          cp "$REPORT" .l039-temp/template-report.txt
          git config user.name "L-039 locator"
          git config user.email "noreply@github.com"
          git add .l039-temp/template-report.txt
          git commit -qm "temp: L-039 template-zero report (throwaway, deleted before PR)"
          git push origin HEAD:refs/heads/arena/7bc5125b-iips-review-recovered
