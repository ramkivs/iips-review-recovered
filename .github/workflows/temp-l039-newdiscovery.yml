name: temp L-039 filings retrieval (throwaway — deleted before PR)

# THROWAWAY. Third pass for the L-039 KEC current-investments question, on a runner (the sandbox cannot reach
# NSE). Pass 1 found the route; pass 2 confirmed the NSE APIs answer and surfaced the exact attachment names.
#
# Already settled and NOT re-read here: the two annual reports in the corpus (FY2025-26 215 pp sha256
# ba638897…c820; FY2024-25 206 pp 29dfdf83…c1c6) were converted page by page and 421 pages searched — no page
# carries a "Current investments" caption (register §17.17).
#
# This pass reads only documents a page search of those two PDFs could not have covered:
#   * the audited results filed for the year ended 31 March 2026 (reg 33 outcome + integrated filing);
#   * the limited-review integrated filings and outcomes for Q1 and Q2 FY2026-27;
#   * the iXBRL instance documents for those filings, which tag balance-sheet line items explicitly.
# Each PDF is hashed, its investment lines are printed, and every page that mentions an investment is dumped
# verbatim. iXBRL is searched for investment element names together with their reported values.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-l039-newdiscovery.yml'

permissions:
  contents: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/7bc5125b-iips-review-recovered

      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils curl >/dev/null

      - name: Collect report into /tmp/l039-report3.txt
        run: |
          set -u
          REPORT=/tmp/l039-report3.txt
          : > "$REPORT"
          exec 3>&1
          exec >> "$REPORT" 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          REF="https://www.nseindia.com/"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -sS -A "$UA" -c /tmp/nse.jar -o /dev/null --max-time 45 "$REF"
          curl -sS -A "$UA" -b /tmp/nse.jar -H 'Accept: application/json' -H "Referer: $REF" --max-time 90 -o /tmp/integrated.json "https://www.nseindia.com/api/integrated-filing-results?index=equities&symbol=KEC"
          echo "integrated bytes=$(stat -c%s /tmp/integrated.json 2>/dev/null || echo 0)"

          echo
          echo "===== SECTION A: full rows for the 2026 integrated filings ====="
          python3 -c "import json;d=json.load(open('/tmp/integrated.json'));rows=d.get('data',[]) if isinstance(d,dict) else d;[print('ROW', r.get('qe_Date'), r.get('consolidated'), r.get('audited')) or [print('   ',k,'=',v) for k,v in sorted(r.items())] for r in rows if str(r.get('qe_Date'))[:10] in ('30-SEP-2026','30-JUN-2026','31-MAR-2026')]" 2>/dev/null || echo "(unreadable)"

          echo
          echo "===== SECTION B: PDF analysis helper output ====="
          analyse() {
            f="$1"; label="$2"
            if ! pdfinfo "$f" >/dev/null 2>&1; then echo "  $label: NOT A PDF (first 120 bytes follow)"; head -c 120 "$f"; echo; return; fi
            echo "  $label: bytes=$(stat -c%s "$f") sha256=$(sha256sum "$f" | cut -d' ' -f1) pages=$(pdfinfo "$f" | awk '/^Pages:/{print $2}')"
            pdftotext -layout "$f" "/tmp/$label.txt"
            echo "  --- page-tagged investment lines ---"
            awk -v L="$label" 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {l=tolower($0); if (l ~ /investment|mutual fund|treasury|current investment/) printf "  %s p%d: %s\n", L, p, l}' "/tmp/$label.txt" | sed 's/[[:space:]]\+$//' | cut -c1-210 | head -60
            echo "  --- pages containing 'balance sheet' / 'financial assets' ---"
            awk 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {l=tolower($0); if (l ~ /balance sheet|financial assets/) printf "  p%d: %s\n", p, l}' "/tmp/$label.txt" | sed 's/[[:space:]]\+$//' | cut -c1-160 | head -20
          }

          TAB=$(printf '\t')
          fetch_pdf() {  # fetch_pdf <label> <url>
            LABEL="$1"; URL="$2"
            echo "--- $LABEL"
            echo "    url=$URL"
            CODE=$(curl -sSL -A "$UA" -H "Referer: $REF" -o /tmp/cand.pdf -w '%{http_code}' --max-time 240 "$URL")
            echo "    http=$CODE bytes=$(stat -c%s /tmp/cand.pdf 2>/dev/null || echo 0)"
            analyse /tmp/cand.pdf "$LABEL"
          }

          echo
          echo "===== SECTION C: audited results for the year ended 31 March 2026 (reg 33 outcome) ====="
          fetch_pdf "fy26-audited-results-outcome" "https://nsearchives.nseindia.com/corporate/KEC_16052026215722_SEintimationFinancials.pdf"

          echo
          echo "===== SECTION D: Q1 FY2026-27 outcome (quarter ended 30 June 2026) ====="
          fetch_pdf "q1fy27-outcome" "https://nsearchives.nseindia.com/corporate/KEC_10082026183220_SE_intimation_Outcome.pdf"

          echo
          echo "===== SECTION E: Q2 FY2026-27 outcome (quarter ended 30 September 2026) ====="
          fetch_pdf "q2fy27-outcome" "https://nsearchives.nseindia.com/corporate/KEC_02112026210430_SE_intimation_BM_outcome_Results.pdf"

          echo
          echo "===== SECTION F: integrated-filing PDFs and iXBRL for 30-SEP-2026 / 30-JUN-2026 / 31-MAR-2026 ====="
          python3 -c "import json;d=json.load(open('/tmp/integrated.json'));rows=d.get('data',[]) if isinstance(d,dict) else d;out=[];[out.append((str(r.get('qe_Date'))[:10]+'-'+str(r.get('consolidated'))+'-'+(r.get('pdf_attach') or ''))) for r in rows if str(r.get('qe_Date'))[:10] in ('30-SEP-2026','30-JUN-2026','31-MAR-2026') and r.get('pdf_attach')];[print(x) for x in out]" > /tmp/pdfs.txt 2>/dev/null
          echo "pdf rows: $(wc -l </tmp/pdfs.txt)"; cut -c1-200 /tmp/pdfs.txt
          while IFS= read -r LINE; do
            [ -n "${LINE:-}" ] || continue
            L="${LINE%%http*}"; U="${LINE#*http}"; U="http$U"
            U=$(printf '%s' "$U" | tr -d ' ')
            case "$U" in http*) fetch_pdf "integrated-$(printf '%s' "$L" | tr -d ' ')" "$U" ;; esac
          done < /tmp/pdfs.txt

          echo
          echo "===== SECTION G: iXBRL instances — investment elements with values ====="
          python3 -c "import json;d=json.load(open('/tmp/integrated.json'));rows=d.get('data',[]) if isinstance(d,dict) else d;out=[(str(r.get('qe_Date'))[:10]+'-'+str(r.get('consolidated'))+chr(9)+(r.get('ixbrl') or '')) for r in rows if str(r.get('qe_Date'))[:10] in ('30-SEP-2026','30-JUN-2026','31-MAR-2026') and r.get('ixbrl')];[print(x) for x in out]" > /tmp/ixbrl.tsv 2>/dev/null
          echo "ixbrl rows: $(wc -l </tmp/ixbrl.tsv)"; cut -c1-200 /tmp/ixbrl.tsv
          while IFS="$TAB" read -r L U; do
            [ -n "${L:-}" ] || continue
            echo "--- iXBRL $L : $U"
            CODE=$(curl -sSL -A "$UA" -H "Referer: $REF" -o /tmp/inst.xml -w '%{http_code}' --max-time 240 "$U")
            echo "    http=$CODE bytes=$(stat -c%s /tmp/inst.xml 2>/dev/null || echo 0) sha256=$(sha256sum /tmp/inst.xml 2>/dev/null | cut -d' ' -f1)"
            python3 -c "import re;t=open('/tmp/inst.xml',errors='ignore').read();print('    ix facts=',len(re.findall(r'<ix:nonFraction',t)));print('    investment element names=',sorted(set(re.findall(r'name=\"([^\"]*[Ii]nvestment[^\"]*)\"',t)))[:20]);[print('    fact:',m.group(1),'=',m.group(2).strip()) for m in re.finditer(r'<ix:nonFraction[^>]*name=\"([^\"]*[Ii]nvestment[^\"]*)\"[^>]*>([^<]*)<',t)];[print('    text:',m.group(0)[:160].replace(chr(10),' ')) for m in list(re.finditer(r'(?is)(current investments?|non-current investments?)',t))[:12]]" 2>/dev/null | head -40
          done < /tmp/ixbrl.tsv

          echo
          echo "===== SECTION H: Q2 FY27 corporate presentation (issuer site, both path roots) ====="
          for P in \
            "https://www.kecrpg.com/media/corporatePresentationFilesMedia/Corporate%20Presentation%20Q2%20FY27.pdf" \
            "https://www.kecrpg.com/public/media/corporatePresentationFilesMedia/Corporate%20Presentation%20Q2%20FY27.pdf"
          do
            fetch_pdf "presentation-$(basename "$P" | tr ' %' '__' | cut -c1-30)" "$P"
          done

          echo
          echo "===== END OF REPORT ====="
          exec >&3 2>&3
          echo "report bytes=$(stat -c%s "$REPORT")"

      - name: Publish report to the branch (temp path)
        if: always()
        run: |
          set -u
          REPORT=/tmp/l039-report3.txt
          [ -s "$REPORT" ] || { echo "no report captured"; exit 0; }
          mkdir -p .l039-temp
          cp "$REPORT" .l039-temp/filings-report.txt
          git config user.name "L-039 locator"
          git config user.email "noreply@github.com"
          git add .l039-temp/filings-report.txt
          git commit -qm "temp: L-039 filings report (throwaway, deleted before PR)"
          git push origin HEAD:refs/heads/arena/7bc5125b-iips-review-recovered
