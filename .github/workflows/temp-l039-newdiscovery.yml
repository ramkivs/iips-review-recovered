name: temp L-039 decisive retrieval (throwaway — deleted before PR)

# THROWAWAY. Fourth pass for the L-039 KEC current-investments question, on a runner (no egress from the sandbox).
#
# Settled and NOT re-read: both annual reports in the corpus (FY2025-26 215 pp sha256 ba638897…c820; FY2024-25
# 206 pp 29dfdf83…c1c6) were converted page by page and 421 pages searched — no page carries a "Current
# investments" caption (register §17.17).
#
# New documents located by pass 3 and read here in full:
#   * audited results for the year ended 31 March 2026  — sha256 29531cee…9303, 23 pp
#   * Q1 FY2026-27 outcome (limited review)             — sha256 b2e183cd…e5ae, 14 pp
#   * Q2 FY2026-27 outcome (limited review)             — sha256 42d826df…144e, 18 pp
#   * Q2 FY27 corporate presentation                    — sha256 d57dd506…636f, 36 pp
# plus the exchange's integrated-filing PDF and iXBRL instance for each of the three quarter-ends, which tag
# balance-sheet line items explicitly. Every balance-sheet page is dumped verbatim and every investment fact in
# the iXBRL is printed with its value.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-l039-newdiscovery.yml'

permissions:
  contents: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/7bc5125b-iips-review-recovered

      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils curl >/dev/null

      - name: Collect report into /tmp/l039-report4.txt
        run: |
          set -u
          REPORT=/tmp/l039-report4.txt
          : > "$REPORT"
          exec 3>&1
          exec >> "$REPORT" 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          REF="https://www.nseindia.com/"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -sS -A "$UA" -c /tmp/nse.jar -o /dev/null --max-time 45 "$REF"
          curl -sS -A "$UA" -b /tmp/nse.jar -H 'Accept: application/json' -H "Referer: $REF" --max-time 90 -o /tmp/integrated.json "https://www.nseindia.com/api/integrated-filing-results?index=equities&symbol=KEC"

          echo
          echo "===== SECTION A: every 2026 integrated-filing row, all fields ====="
          python3 -c "import json;d=json.load(open('/tmp/integrated.json'));rows=d.get('data',[]) if isinstance(d,dict) else d;sel=[r for r in rows if any(x in str(r.get('qe_Date')) for x in ('30-SEP-2026','30-JUN-2026','31-MAR-2026'))];print('selected rows=',len(sel));[ (print('ROW',r.get('qe_Date'),r.get('consolidated'),r.get('audited')), [print('    ',k,'=',str(v)[:180]) for k,v in sorted(r.items())]) for r in sel]" 2>&1 | head -60

          echo
          echo "===== SECTION B: fetch every URL carried by those rows ====="
          python3 -c "import json;d=json.load(open('/tmp/integrated.json'));rows=d.get('data',[]) if isinstance(d,dict) else d;sel=[r for r in rows if any(x in str(r.get('qe_Date')) for x in ('30-SEP-2026','30-JUN-2026','31-MAR-2026'))];out=[];[(out.extend([(str(r.get('qe_Date'))+'-'+str(r.get('consolidated'))+'-'+k, str(v)) for k,v in sorted(r.items()) if isinstance(v,str) and v.startswith('http')])) for r in sel];[print(l+chr(9)+u) for l,u in out]" > /tmp/urls.tsv 2>/dev/null
          echo "url rows: $(wc -l </tmp/urls.tsv)"; cut -c1-190 /tmp/urls.tsv | head -20

          analyse_pdf() {
            f="$1"; label="$2"; pages="$3"
            if ! pdfinfo "$f" >/dev/null 2>&1; then echo "  $label: NOT A PDF"; head -c 120 "$f"; echo; return; fi
            echo "  $label: bytes=$(stat -c%s "$f") sha256=$(sha256sum "$f" | cut -d' ' -f1) pages=$(pdfinfo "$f" | awk '/^Pages:/{print $2}')"
            pdftotext -layout "$f" "/tmp/$label.txt"
            echo "  --- investment / treasury lines ---"
            awk -v L="$label" 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {l=tolower($0); if (l ~ /investment|mutual fund|treasury|net debt|current invest/) printf "  %s p%d: %s\n", L, p, l}' "/tmp/$label.txt" | sed 's/[[:space:]]\+$//' | cut -c1-200 | head -50
            for pg in $pages; do
              echo "  === $label PAGE $pg (verbatim) ==="
              pdftotext -layout -f "$pg" -l "$pg" "$f" - | sed 's/[[:space:]]\+$//'
              echo "  === END $label PAGE $pg ==="
            done
          }

          fetch_any() {  # fetch_any <label> <url>
            LABEL="$1"; URL="$2"
            echo "--- $LABEL"
            echo "    url=$URL"
            CODE=$(curl -sSL -A "$UA" -H "Referer: $REF" -o /tmp/cand.bin -w '%{http_code}' --max-time 240 "$URL")
            SZ=$(stat -c%s /tmp/cand.bin 2>/dev/null || echo 0)
            echo "    http=$CODE bytes=$SZ sha256=$(sha256sum /tmp/cand.bin 2>/dev/null | cut -d' ' -f1)"
            if head -c 4 /tmp/cand.bin | grep -q '%PDF'; then
              analyse_pdf /tmp/cand.bin "$LABEL" ""
            else
              echo "    (not a PDF — treated as iXBRL/markup)"
              python3 -c "import re;t=open('/tmp/cand.bin',errors='ignore').read();print('    ix facts=',len(re.findall(r'<ix:nonFraction',t)));print('    investment element names=',sorted(set(re.findall(r'name=\"([^\"]*[Ii]nvestment[^\"]*)\"',t)))[:25]);[print('    fact:',m.group(1),'=',m.group(2).strip()) for m in re.finditer(r'<ix:nonFraction[^>]*name=\"([^\"]*[Ii]nvestment[^\"]*)\"[^>]*>([^<]*)<',t)];[print('    text:',m.group(0)[:150].replace(chr(10),' ')) for m in list(re.finditer(r'(?is)(current investments?|non-current investments?)',t))[:12]]" 2>/dev/null | head -40
            fi
          }

          TAB=$(printf '\t')
          while IFS="$TAB" read -r L U; do
            [ -n "${L:-}" ] || continue
            case "$U" in http*) fetch_any "$(printf '%s' "$L" | tr -d ' ')" "$U" ;; esac
          done < /tmp/urls.tsv

          echo
          echo "===== SECTION C: audited FY2026 results — balance-sheet pages verbatim ====="
          curl -sSL -A "$UA" -H "Referer: $REF" -o /tmp/fy26.pdf --max-time 240 "https://nsearchives.nseindia.com/corporate/KEC_16052026215722_SEintimationFinancials.pdf"
          echo "  expect sha256 29531ceeea6e72f3ec8278fec2881452fafe2e5077412e795dd3d8886c4e9303 / 23 pages"
          analyse_pdf /tmp/fy26.pdf "fy26-audited-results" "8 9 10"

          echo
          echo "===== SECTION D: Q1 FY27 — every page that mentions assets or total ====="
          curl -sSL -A "$UA" -H "Referer: $REF" -o /tmp/q1.pdf --max-time 240 "https://nsearchives.nseindia.com/corporate/KEC_10082026183220_SE_intimation_Outcome.pdf"
          echo "  expect sha256 b2e183cd6ddc17c2b60c034a20ac8cd2d81cb5b4a946b8a36175e084fd31e5ae / 14 pages"
          pdftotext -layout /tmp/q1.pdf /tmp/q1.txt
          echo "  --- pages mentioning 'assets' or 'equity and liabilities' ---"
          awk 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {l=tolower($0); if (l ~ /total assets|equity and liabilities|current assets/) printf "  p%d: %s\n", p, l}' /tmp/q1.txt | sed 's/[[:space:]]\+$//' | cut -c1-170 | head -12
          for pg in 6 7 8; do
            echo "  === q1fy27 PAGE $pg (verbatim) ==="
            pdftotext -layout -f "$pg" -l "$pg" /tmp/q1.pdf - | sed 's/[[:space:]]\+$//'
            echo "  === END q1fy27 PAGE $pg ==="
          done

          echo
          echo "===== SECTION E: Q2 FY27 — balance-sheet page verbatim ====="
          curl -sSL -A "$UA" -H "Referer: $REF" -o /tmp/q2.pdf --max-time 240 "https://nsearchives.nseindia.com/corporate/KEC_02112026210430_SE_intimation_BM_outcome_Results.pdf"
          echo "  expect sha256 42d826df45b0b561460980fbc7a1f8fab2ff3985ec1196fe42706f0e4097144e / 18 pages"
          analyse_pdf /tmp/q2.pdf "q2fy27-outcome" "7"

          echo
          echo "===== SECTION F: Q2 FY27 presentation — net debt / cash / treasury wording ====="
          curl -sSL -A "$UA" -o /tmp/pres.pdf --max-time 240 "https://www.kecrpg.com/media/corporatePresentationFilesMedia/Corporate%20Presentation%20Q2%20FY27.pdf"
          echo "  expect sha256 d57dd5069cfb80a6dbd4e6c99463c4b8baffe446f426a69f140926729e18636f / 36 pages"
          pdftotext -layout /tmp/pres.pdf /tmp/pres.txt
          awk 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {l=tolower($0); if (l ~ /net debt|cash and|cash &|treasury|investment/) printf "  p%d: %s\n", p, l}' /tmp/pres.txt | sed 's/[[:space:]]\+$//' | cut -c1-200 | head -40

          echo
          echo "===== END OF REPORT ====="
          exec >&3 2>&3
          echo "report bytes=$(stat -c%s "$REPORT")"

      - name: Publish report to the branch (temp path)
        if: always()
        run: |
          set -u
          REPORT=/tmp/l039-report4.txt
          [ -s "$REPORT" ] || { echo "no report captured"; exit 0; }
          mkdir -p .l039-temp
          cp "$REPORT" .l039-temp/decisive-report.txt
          git config user.name "L-039 locator"
          git config user.email "noreply@github.com"
          git add .l039-temp/decisive-report.txt
          git commit -qm "temp: L-039 decisive retrieval report (throwaway, deleted before PR)"
          git push origin HEAD:refs/heads/arena/7bc5125b-iips-review-recovered
