name: L-039 temporary disclosure discovery (throwaway)

# THROWAWAY. Exists only to read the two KEC annual reports from a GitHub-hosted runner, because
# kecrpg.com is not reachable from the development sandbox. It downloads the PDFs, identifies them by
# sha256, greps every page for the cash / bank / investment captions, and uploads the matching pages and a
# hit report as an artifact for the IRR session to read. It writes nothing to the repository and is
# deleted before the pull request that uses its output.

on:
  push:
    paths:
      - '.github/workflows/temp-l039-discover.yml'

permissions:
  contents: read

jobs:
  discover:
    name: Fetch and grep both annual reports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Fetch the two annual reports and identify them by hash
        run: |
          set -euo pipefail
          mkdir -p out/pages
          curl -sSL --retry 3 -o fy26.pdf https://www.kecrpg.com/public/media/annualReportMedia/KEC_Annual_Report_2025-26.pdf
          curl -sSL --retry 3 -o fy25.pdf https://www.kecrpg.com/public/media/annualReportMedia/KEC_Annual_Report_2024-25.pdf
          {
            echo "## sha256 and size"
            sha256sum fy26.pdf fy25.pdf
            echo "## bytes"
            wc -c fy26.pdf fy25.pdf
            echo "## pages"
            pdfinfo fy26.pdf | grep -E '^(Pages|Title|CreationDate)'
            pdfinfo fy25.pdf | grep -E '^(Pages|Title|CreationDate)'
          } | tee out/source-identity.txt

      - name: Grep every page for the cash, bank and investment captions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, unicodedata
          from pathlib import Path

          out = Path('out')
          (out / 'pages').mkdir(parents=True, exist_ok=True)

          docs = {'fy26': ('fy26.pdf', 'KEC_Annual_Report_2025-26.pdf'),
                  'fy25': ('fy25.pdf', 'KEC_Annual_Report_2024-25.pdf')}

          patterns = {
              'current_investment': r'current\s+investment',
              'non_current_investment': r'non[-\s]?current\s+investment',
              'investments': r'\binvestments?\b',
              'mutual_fund': r'mutual\s+fund',
              'bank_balances': r'bank\s+balances?',
              'cash_and_cash_equivalents': r'cash\s+and\s+cash\s+equivalents?',
              'note_17': r'note\s*17\b',
              'note_18': r'note\s*18\b',
              'note_19': r'note\s*19\b',
              'note_10': r'note\s*10\b',
          }

          report = []
          keep = set()
          for key, (pdf, name) in docs.items():
              pages = int(re.search(r'Pages:\s+(\d+)',
                          subprocess.run(['pdfinfo', pdf], capture_output=True, text=True, check=True).stdout).group(1))
              report.append(f'== {key} {name} ({pages} pages)')
              for page in range(1, pages + 1):
                  text = subprocess.run(['pdftotext', '-layout', '-f', str(page), '-l', str(page), pdf, '-'],
                                        capture_output=True, text=True).stdout
                  flat = unicodedata.normalize('NFKC', text)
                  hits = {k: len(re.findall(p, flat, flags=re.I)) for k, p in patterns.items()}
                  interesting = [k for k in ('current_investment', 'non_current_investment', 'mutual_fund',
                                             'note_17', 'note_18', 'note_19', 'note_10') if hits[k]]
                  if hits['current_investment'] or hits['mutual_fund']:
                      keep.add((key, page))
                  if interesting:
                      report.append(f'{key} p{page}: ' + ', '.join(f'{k}={hits[k]}' for k in interesting)
                                    + f' | investments={hits["investments"]} bank_balances={hits["bank_balances"]}'
                                    + f' cash={hits["cash_and_cash_equivalents"]}')
              # also keep the pages carrying the cash/bank notes themselves
          # second pass: keep every page that names NOTE 17/18/19 or the cash-flow reconciliation
          for key, (pdf, name) in docs.items():
              pages = int(re.search(r'Pages:\s+(\d+)',
                          subprocess.run(['pdfinfo', pdf], capture_output=True, text=True, check=True).stdout).group(1))
              for page in range(1, pages + 1):
                  text = subprocess.run(['pdftotext', '-layout', '-f', str(page), '-l', str(page), pdf, '-'],
                                        capture_output=True, text=True).stdout
                  flat = unicodedata.normalize('NFKC', text)
                  if re.search(r'note\s*(17|18|19)\b', flat, flags=re.I) and re.search(r'(?i)note\s*(17|18|19)\s*[-–—:]', flat):
                      keep.add((key, page))
                  if re.search(r'(?i)bank balances.{0,80}not considered as cash', flat, flags=re.S):
                      keep.add((key, page))

          for key, page in sorted(keep):
              pdf = docs[key][0]
              text = subprocess.run(['pdftotext', '-layout', '-f', str(page), '-l', str(page), pdf, '-'],
                                    capture_output=True, text=True).stdout
              (out / 'pages' / f'{key}-p{page:03d}.txt').write_text(text, encoding='utf-8')
          (out / 'hits.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          print(f'{len(keep)} pages kept')
          PY

      - name: Upload what was read
        uses: actions/upload-artifact@v4
        with:
          name: l039-pages
          path: out/
          retention-days: 3
