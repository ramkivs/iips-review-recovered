name: Temporary L-039 artifact recovery
on:
  push:
    paths:
      - '.github/workflows/temp-l039-fact-context.yml'
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/7bc5125b-iips-review-recovered
      - name: Recover previously generated artifact without repeating retrieval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .l039-recovered
          gh run download 42453414758 --name l039-fact-context --dir .l039-recovered
          ls -l .l039-recovered
      - name: Publish temporary evidence for local inspection
        run: |
          git config user.name 'L-039 evidence probe'
          git config user.email 'noreply@github.com'
          git add .l039-recovered
          git commit -m 'temp: recover L-039 fact context artifact'
          git push origin HEAD:refs/heads/arena/7bc5125b-iips-review-recovered
