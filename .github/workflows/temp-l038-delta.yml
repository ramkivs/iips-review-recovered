name: Temporary L-038 delta evidence capture
on:
  push:
    branches: ['arena/dea7aba4-iips-review-recovered']
    paths: ['.github/workflows/temp-l038-delta.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    strategy:
      matrix:
        batch: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Recover existing capture only (no source re-fetch)
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ matrix.batch }}
        run: |
          gh run download 44250008327 -n l038-delta-capture -D l038-delta-capture
          python - <<'PY'
          import base64, json, os, pathlib, zlib
          files = {str(p.relative_to('l038-delta-capture')): p.read_text() for p in pathlib.Path('l038-delta-capture').rglob('*') if p.is_file()}
          encoded = base64.b64encode(zlib.compress(json.dumps(files).encode(), 9)).decode()
          chunks = [encoded[i:i+3500] for i in range(0, len(encoded), 3500)]
          batch = int(os.environ['BATCH'])
          for i in range(batch*9, min((batch+1)*9, len(chunks))):
              print(f'::notice title=L038_EVIDENCE_{i:03d}::{chunks[i]}')
          print(f'Capture transport total chunks={len(chunks)}; capacity=36')
          assert len(chunks) <= 36
          PY
