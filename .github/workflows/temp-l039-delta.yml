name: Temporary L-039 delta evidence capture
on:
  push:
    branches: ['arena/3c6fd35e-iips-review-recovered']
    paths: ['.github/workflows/temp-l039-delta.yml', 'scripts/l039_delta_followup_probe.py']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated parser (no product or IPD installation)
        run: python -m pip install --target "$RUNNER_TEMP/l039-parser" pypdf==6.1.3
      - name: Official source probe
        run: |
          PYTHONPATH="$RUNNER_TEMP/l039-parser" python scripts/l039_delta_followup_probe.py
          mv l039-followup-capture followup-retry
          mkdir -p l039-delta-capture
          mv followup-retry l039-delta-capture/
      - name: Evidence transport via bounded check annotations
        run: |
          python - <<'PY'
          import base64, json, pathlib, zlib
          files = {str(p.relative_to('l039-delta-capture')): base64.b64encode(p.read_bytes()).decode() for p in sorted(pathlib.Path('l039-delta-capture').rglob('*')) if p.is_file()}
          encoded = base64.b64encode(zlib.compress(json.dumps(files,sort_keys=True).encode(),9)).decode()
          print('transport encoded bytes',len(encoded))
          for i in range(0,len(encoded),3500):
              print(f'::notice title=L039_EVIDENCE_{i//3500:04d}::{encoded[i:i+3500]}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: l039-delta-capture
          path: l039-delta-capture/
          retention-days: 7
