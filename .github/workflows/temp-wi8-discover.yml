name: TEMP WI-8 identity check (deleted before merge)
on:
  push:
    branches:
      - arena/60fea33a-iips-review-recovered
    paths:
      - '.github/workflows/temp-wi8-discover.yml'
permissions:
  contents: write
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/60fea33a-iips-review-recovered
      - name: exchange identifier check
        env:
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
        run: |
          set +e
          D=evidence/real-issuer/_wi8-identity
          mkdir -p "$D"
          probe() {
            slug="$1"; url="$2"
            code=$(curl -sSL --max-time 60 -A "$UA" -H "Accept: text/html" -o "$D/$slug.html" -w '%{http_code}' "$url")
            printf '%s\t%s\t%s\t%s\n' "$slug" "$code" "$(wc -c < "$D/$slug.html" 2>/dev/null)" "$url" >> "$D/status.tsv"
            [ -s "$D/$slug.html" ] && { echo "### $slug http=$code url=$url"; grep -oiE "(KEC[^<>]{0,60}|532714|INE389H01022|KEC International[^<>]{0,40})" "$D/$slug.html" | sort -u | head -20; } >> "$D/evidence.txt"
          }
          probe bse-company "https://www.bseindia.com/stock-share-price/kec-international-ltd/kec/532714/"
          probe bse-quote "https://www.bseindia.com/stock-share-price/kec-international-ltd/kec/532714"
          probe nse-quote "https://www.nseindia.com/get-quotes/equity?symbol=KEC"
          probe nse-home "https://www.nseindia.com/companies-listing/corporate-filings-annual-reports"
          probe bse-ar-page "https://www.bseindia.com/corporates/ann.html?scrip=532714"
          cat "$D/status.tsv"
          head -60 "$D/evidence.txt"
          git config user.name "wi8-identity"
          git config user.email "wi8-identity@users.noreply.github.com"
          git add -A "$D"
          git commit -m "WI-8: temp exchange identifier check (deleted before merge)" || echo "nothing to commit"
          git push origin HEAD:arena/60fea33a-iips-review-recovered || echo "push failed"
