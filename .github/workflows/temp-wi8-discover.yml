name: TEMP WI-8 fetch (deleted before merge)
on:
  push:
    branches:
      - arena/60fea33a-iips-review-recovered
    paths:
      - '.github/workflows/temp-wi8-discover.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/60fea33a-iips-review-recovered
      - name: fetch KEC annual reports and extract full text
        env:
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
        run: |
          set +e
          D=evidence/real-issuer/_wi8-fulltext
          mkdir -p "$D"
          if ! command -v pdftotext >/dev/null; then sudo apt-get update -qq; sudo apt-get install -y -qq poppler-utils; fi
          fetch() { # name url
            name="$1"; url="$2"
            code=$(curl -sSL --max-time 600 --retry 2 -A "$UA" -o "/tmp/$name.pdf" -w '%{http_code}' "$url")
            echo -e "fetch-$name\t$code\t$(wc -c < /tmp/$name.pdf)\tsha256=$(sha256sum /tmp/$name.pdf | cut -d' ' -f1)\t$(pdfinfo /tmp/$name.pdf 2>/dev/null | grep -E '^Pages' | tr -s ' ')  url=$url" >> "$D/fetch.tsv"
            pdftotext -layout "/tmp/$name.pdf" "$D/$name.txt"
            echo -e "text-$name\tlines=$(wc -l < $D/$name.txt)\tformfeeds=$(grep -c $'\f' $D/$name.txt)" >> "$D/fetch.tsv"
          }
          K=https://www.kecrpg.com/public/media/annualReportMedia
          fetch kec-ar-2025-26 "$K/KEC_Annual_Report_2025-26.pdf"
          fetch kec-ar-2024-25 "$K/KEC_Annual_Report_2024-25.pdf"
          # also probe the prior year, recorded as a 404 or a document, never silently assumed
          code=$(curl -sS --max-time 60 -A "$UA" -r 0-511 -o /tmp/probe.bin -w '%{http_code}' "$K/KEC_Annual_Report_2023-24.pdf")
          echo -e "probe-kec-ar-2023-24\t$code\t$(wc -c < /tmp/probe.bin)\t$K/KEC_Annual_Report_2023-24.pdf" >> "$D/fetch.tsv"
          cat "$D/fetch.tsv"
          git config user.name "wi8-fetch"
          git config user.email "wi8-fetch@users.noreply.github.com"
          git add -A "$D"
          git commit -m "WI-8: temp KEC annual-report bytes and full text (deleted before merge)" || echo "nothing to commit"
          git push origin HEAD:arena/60fea33a-iips-review-recovered || echo "push failed"
