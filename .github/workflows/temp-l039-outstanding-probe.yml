name: temp L-039 XBRL-zero adjudication probe (throwaway — deleted before PR)

# THROWAWAY. Runner-side retrieval for the one question the earlier L-039 passes left open.
#
# Already established in this session (reports preserved on the branch under .l039-temp/):
#   * NSE integrated filings are reachable from a runner; BSE's API is 403 (Akamai) and kecrpg.com IR pages
#     serve a 72,140-byte JavaScript shell, so issuer-side results PDFs cannot be enumerated there.
#   * The audited consolidated Reg 33 statement as at 31 March 2026 (PDF sha256 29531cee…9303, 23 pp) prints
#     (a) Inventories, (b)(i) Trade receivables, (b)(ii) Cash, (b)(iii) Bank balances, (b)(iv) Other financial
#     assets — and NO current-investments caption; the non-current block prints "(i) Investments" with NO value.
#   * The 31-MAR-2026 machine instance tags in-capmkt:CurrentInvestments = 0 and in-capmkt:NoncurrentInvestments = 0.
#
# THE QUESTION THIS RUN SETTLES: is that tagged zero an issuer assertion ("current investments are nil") or the
# filing tool's default for an unpopulated element? The discriminator is the same instance's other investment
# element, because the standalone statements PRINT a value for it:
#   consolidated PDF: "(i) Investments" printed BLANK  -> instance tags NoncurrentInvestments = 0
#   standalone  PDF: "(i) Investments" printed 1,422.69 -> instance tags NoncurrentInvestments = 14226900000
# If that holds, the zero tracks the ABSENCE of a printed value, not a printed nil — and a tagged zero cannot be
# used to turn an absent caption into a declared nil.
# This run also probes the two annual reports that have never been readable (FY2026-27 does not exist yet;
# FY2023-24 was 404) and records each failure as an access limitation, never as absence.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-l039-outstanding-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/7bc5125b-iips-review-recovered

      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils curl >/dev/null

      - name: Collect evidence into /tmp/l039-report3.txt
        run: |
          set -u
          REPORT=/tmp/l039-report3.txt
          : > "$REPORT"
          exec 3>&1
          exec >> "$REPORT" 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          H=(-H 'Accept-Language: en-US,en;q=0.9' -H 'Referer: https://www.nseindia.com/')

          echo "===== SECTION A: NSE integrated-filing index — is there any annual filing after 31-MAR-2026? ====="
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -sS -A "$UA" -c /tmp/cj -b /tmp/cj "${H[@]}" --max-time 90 "https://www.nseindia.com/" -o /tmp/nse.html -w '  home http=%{http_code}\n'
          curl -sS -A "$UA" -c /tmp/cj -b /tmp/cj "${H[@]}" -H 'Accept: application/json' --max-time 90 \
            "https://www.nseindia.com/api/integrated-filing-results?index=equities&symbol=KEC" -o /tmp/if.json -w '  integrated http=%{http_code} bytes=%{size_download}\n'
          python3 - <<'PY'
import json
d=json.load(open('/tmp/if.json'))
rows=d.get('data',d if isinstance(d,list) else [])
print(f"  rows={len(rows)}")
for r in rows:
    print("   ", r.get('qe_Date'), r.get('consolidated'), r.get('audited'), "| xbrl:", (r.get('xbrl') or '').split('/')[-1], "| ixbrl:", (r.get('ixbrl') or '').split('/')[-1])
PY
          echo
          echo "===== SECTION B: annual-report probes (documents never read) ====="
          for pair in \
            "https://www.kecrpg.com/public/media/annualReportMedia/KEC_Annual_Report_2026-27.pdf|ar2627" \
            "https://www.kecrpg.com/public/media/annualReportMedia/KEC_Annual_Report_2023-24.pdf|ar2324" \
            "https://www.kecrpg.com/public/media/annualReportMedia/KEC_Annual_Report_2025-26.pdf|ar2526_control"
          do
            url="${pair%%|*}"; label="${pair##*|}"
            code=$(curl -sSL -A "$UA" -o /dev/null -w '%{http_code}' --max-time 60 -I "$url")
            ct=$(curl -sSL -A "$UA" -o /dev/null -w '%{content_type}' --max-time 60 -I "$url")
            echo "  $label http=$code ct=$ct  $url"
          done
          echo "  --- Wayback CDX for the FY2023-24 report (any timestamp) ---"
          curl -sS --max-time 120 "https://web.archive.org/cdx/search/cdx?url=kecrpg.com/public/media/annualReportMedia/*&output=txt&fl=original,timestamp,statuscode&collapse=urlkey&limit=500" -o /tmp/cdx2.txt -w '  cdx http=%{http_code} lines=%{size_download}\n'
          cat /tmp/cdx2.txt | head -40

          echo
          echo "===== SECTION C: the two audited 31-MAR-2026 machine instances ====="
          for pair in \
            "https://nsearchives.nseindia.com/corporate/xbrl/INTEGRATED_FILING_INDAS_1668450_16052026105416_WEB.xml|consolidated" \
            "https://nsearchives.nseindia.com/corporate/xbrl/INTEGRATED_FILING_INDAS_1668449_16052026105222_WEB.xml|standalone" \
            "https://nsearchives.nseindia.com/corporate/ixbrl/INTEGRATED_FILING_INDAS_158430_16052026225416_iXBRL_WEB.html|consolidated-ixbrl"
          do
            url="${pair%%|*}"; label="${pair##*|}"
            code=$(curl -sSL -A "$UA" "${H[@]}" --max-time 120 -o /tmp/$label.bin -w '%{http_code}')
            echo "--- $label http=$code bytes=$(stat -c%s /tmp/$label.bin) sha256=$(sha256sum /tmp/$label.bin | cut -d' ' -f1)"
            echo "    url=$url"
          done

          echo
          echo "===== SECTION D: every fact in the consolidated instance whose name contains 'Invest' ====="
          python3 - <<'PY'
import re
x=open('/tmp/consolidated.bin',encoding='utf-8',errors='replace').read()
ctx={}
for m in re.finditer(r'<xbrli:context id="([^"]+)"(.*?)</xbrli:context>', x, re.S):
    cid, body = m.group(1), m.group(2)
    inst=re.search(r'<xbrli:instant>([^<]+)</xbrli:instant>', body)
    start=re.search(r'<xbrli:startDate>([^<]+)</xbrli:startDate>', body)
    end=re.search(r'<xbrli:endDate>([^<]+)</xbrli:endDate>', body)
    ctx[cid]=("instant "+inst.group(1) if inst else f"duration {start.group(1) if start else '?'}..{end.group(1) if end else '?'}")
print(f"  contexts={len(ctx)}")
facts=re.findall(r'<in-capmkt:([A-Za-z0-9]*Invest[A-Za-z0-9]*)\s+contextRef="([^"]+)"(?:\s+unitRef="([^"]+)")?\s*>\s*([^<]*?)\s*</in-capmkt:', x)
named=0
for name,cid,unit,val in facts:
    named+=1
    print(f"  FACT {name} = {val}  [{ctx.get(cid,cid)}] unit={unit}")
print(f"  invest-named facts={named}")
allfacts=re.findall(r'<in-capmkt:([A-Za-z0-9_]+)\s+contextRef="[^"]+"(?:\s+unitRef="[^"]+")?\s*>\s*([^<]*?)\s*</in-capmkt:', x)
zeros=[n for n,v in allfacts if v.strip() in ('0','0.0','0.00')]
print(f"  total in-capmkt facts={len(allfacts)}  distinct={len(set(n for n,_ in allfacts))}  zero-valued facts={len(zeros)}  distinct zero elements={len(set(zeros))}")
print("  zero-valued elements (first 40):", sorted(set(zeros))[:40])
PY

          echo
          echo "===== SECTION E: the same facts in the STANDALONE instance (the control) ====="
          python3 - <<'PY'
import re
x=open('/tmp/standalone.bin',encoding='utf-8',errors='replace').read()
facts=re.findall(r'<in-capmkt:([A-Za-z0-9]*Invest[A-Za-z0-9]*)\s+contextRef="([^"]+)"(?:\s+unitRef="[^"]+")?\s*>\s*([^<]*?)\s*</in-capmkt:', x)
for name,cid,val in facts:
    print(f"  FACT {name} = {val}")
allfacts=re.findall(r'<in-capmkt:([A-Za-z0-9_]+)\s+contextRef="[^"]+"(?:\s+unitRef="[^"]+")?\s*>\s*([^<]*?)\s*</in-capmkt:', x)
zeros=[n for n,v in allfacts if v.strip() in ('0','0.0','0.00')]
print(f"  total in-capmkt facts={len(allfacts)}  distinct={len(set(n for n,_ in allfacts))}  zero-valued facts={len(zeros)}  distinct zero elements={len(set(zeros))}")
PY

          echo
          echo "===== SECTION F: is the rendered 'Current investments' row a TAGGED FACT or template text? ====="
          python3 - <<'PY'
import re
x=open('/tmp/consolidated-ixbrl.bin',encoding='utf-8',errors='replace').read()
print(f"  ixbrl bytes={len(x)}")
for m in re.finditer(r'Current investments', x, re.I):
    s=max(0,m.start()-700); e=min(len(x), m.end()+300)
    window=x[s:e]
    window=re.sub(r'\s+',' ',window)
    print("  --- around 'Current investments' ---")
    print("  "+window[:900])
    print()
# does any ix:nonFraction carry the CurrentInvestments element?
tag=re.findall(r'<ix:nonFraction[^>]*name="in-capmkt:CurrentInvestments"[^>]*>([^<]*)</ix:nonFraction>', x)
print(f"  ix:nonFraction with name=in-capmkt:CurrentInvestments: {tag}")
tag2=re.findall(r'<ix:nonFraction[^>]*name="in-capmkt:NoncurrentInvestments"[^>]*>([^<]*)</ix:nonFraction>', x)
print(f"  ix:nonFraction with name=in-capmkt:NoncurrentInvestments: {tag2}")
print(f"  occurrences of 'Biological assets': {len(re.findall('Biological assets', x, re.I))}")
print(f"  occurrences of 'Regulatory deferral': {len(re.findall('Regulatory deferral', x, re.I))}")
PY

          echo
          echo "===== SECTION G: the audited consolidated PDF row, byte-exact (control that it is blank) ====="
          curl -sSL -A "$UA" "${H[@]}" --max-time 240 -o /tmp/fy26res.pdf "https://nsearchives.nseindia.com/corporate/KEC_16052026215722_SEintimationFinancials.pdf"
          if pdfinfo /tmp/fy26res.pdf >/dev/null 2>&1; then
            echo "  bytes=$(stat -c%s /tmp/fy26res.pdf) sha256=$(sha256sum /tmp/fy26res.pdf | cut -d' ' -f1) pages=$(pdfinfo /tmp/fy26res.pdf | awk '/^Pages:/{print $2}') (expect 10047982 / 29531cee…9303 / 23)"
            echo "  --- page 9 lines 1-30 with visible end-of-line markers ---"
            pdftotext -layout -f 9 -l 9 /tmp/fy26res.pdf - | sed -n '1,30p' | cat -A | sed 's/\$$/<EOL>/' | cut -c1-200
            echo "  --- any occurrence of 'current investment' anywhere in the PDF ---"
            pdftotext -layout /tmp/fy26res.pdf /tmp/fy26res.txt
            grep -in "current investment" /tmp/fy26res.txt || echo "  (none)"
            echo "  --- page 20 (standalone) lines carrying 'Investments' ---"
            pdftotext -layout -f 20 -l 20 /tmp/fy26res.pdf - | grep -nE "Investments|Investments" | cut -c1-160
          else
            echo "  PDF unavailable in this run (environment limitation, not absence)"
          fi

          echo
          echo "===== END OF REPORT ====="
          exec >&3 2>&3
          echo "report bytes=$(stat -c%s "$REPORT")"

      - name: Publish report to the branch (temp path)
        if: always()
        run: |
          set -u
          REPORT=/tmp/l039-report3.txt
          [ -s "$REPORT" ] || { echo "no report captured"; exit 0; }
          mkdir -p .l039-temp
          cp "$REPORT" .l039-temp/xbrl-zero-adjudication-report.txt
          git config user.name "L-039 probe"
          git config user.email "noreply@github.com"
          git add .l039-temp/xbrl-zero-adjudication-report.txt
          git commit -qm "temp: L-039 XBRL-zero adjudication output (throwaway, deleted before PR)"
          git push origin HEAD:refs/heads/arena/7bc5125b-iips-review-recovered
