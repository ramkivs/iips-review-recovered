name: temp L-038 preference-share locator (throwaway — deleted before PR)

# THROWAWAY. One-off retrieval for the L-038 preference-capital question on a runner that can reach the
# issuer host (the sandbox cannot). It:
#   1. re-verifies the FY2023-24 report's identity (bytes + sha256 + pages);
#   2. locates EVERY page of it that mentions "preference" (so the share-capital note structure 12(a)/12(b)/12(c)
#      is mapped rather than guessed) and dumps PDF page 190 verbatim;
#   3. probes whether a LATER audited consolidated annual report is published at the same host, and if so
#      identifies it and lists its "preference" / "only one class" pages.
# Output is published by committing it to a temp path on the same branch (run logs are not reachable from the
# working sandbox). The workflow file and the temp path are both removed before the PR.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-l038-preference-locate.yml'

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/39e78147-iips-review-recovered

      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils curl >/dev/null

      - name: Collect evidence into /tmp/l038-report.txt
        run: |
          set -u
          REPORT=/tmp/l038-report.txt
          : > "$REPORT"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          FY24_URL="https://marico.com/investorspdf/Marico_Annual_Report_FY24.pdf"

          run() { echo "+ $*" ; }
          exec 3>&1
          exec >> "$REPORT" 2>&1

          echo "===== SECTION 1: FY2023-24 identity ====="
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "url=$FY24_URL"
          curl -sSL -A "$UA" -H 'Accept: application/pdf,*/*' -o /tmp/fy24.pdf "$FY24_URL"
          echo "curl_rc=$?"
          echo "bytes=$(stat -c%s /tmp/fy24.pdf 2>/dev/null || echo 0)"
          echo "sha256=$(sha256sum /tmp/fy24.pdf 2>/dev/null | cut -d' ' -f1)"
          echo "mime=$(file -b --mime-type /tmp/fy24.pdf 2>/dev/null)"
          echo "pages=$(pdfinfo /tmp/fy24.pdf 2>/dev/null | awk '/^Pages:/{print $2}')"
          pdfinfo /tmp/fy24.pdf 2>/dev/null | grep -E '^(Title|Author|Producer|CreationDate|ModDate):' || true

          if pdfinfo /tmp/fy24.pdf >/dev/null 2>&1; then
            pdftotext -layout /tmp/fy24.pdf /tmp/fy24.txt || true
            echo
            echo "===== SECTION 2: every page mentioning 'preference' (FY24) ====="
            awk 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {if (tolower($0) ~ /preference/) printf "p%d: %s\n", p, $0}' /tmp/fy24.txt | sed 's/[[:space:]]\+$//'
            echo
            echo "===== SECTION 3: every page mentioning 'only one class' (FY24) ====="
            awk 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {if (tolower($0) ~ /only one class/) printf "p%d: %s\n", p, $0}' /tmp/fy24.txt | sed 's/[[:space:]]\+$//'
            echo
            echo "===== SECTION 4: FY24 PDF page 190 verbatim (-layout) ====="
            echo "=== BEGIN PAGE 190 ==="
            pdftotext -layout -f 190 -l 190 /tmp/fy24.pdf - | sed 's/[[:space:]]\+$//'
            echo "=== END PAGE 190 ==="
            echo
            echo "===== SECTION 5: FY24 page 189 tail / page 191 head (context) ====="
            echo "=== BEGIN PAGE 189 (last 45 lines) ==="
            pdftotext -layout -f 189 -l 189 /tmp/fy24.pdf - | sed 's/[[:space:]]\+$//' | tail -45
            echo "=== END PAGE 189 ==="
            echo "=== BEGIN PAGE 191 (first 30 lines) ==="
            pdftotext -layout -f 191 -l 191 /tmp/fy24.pdf - | sed 's/[[:space:]]\+$//' | head -30
            echo "=== END PAGE 191 ==="
          else
            echo "NOT A PDF — content sections skipped"
            head -c 400 /tmp/fy24.pdf | tr -d '\000'
          fi

          echo
          echo "===== SECTION 6: is a later audited annual report published? ====="
          for URL in \
            "https://marico.com/investorspdf/Marico_Annual_Report_FY25.pdf" \
            "https://marico.com/investorspdf/Marico_Annual_Report_FY2024-25.pdf" \
            "https://marico.com/investorspdf/Marico_Integrated_Annual_Report_2024-25.pdf" \
            "https://marico.com/investorspdf/Marico_Annual_Report_2024-25.pdf"
          do
            rm -f /tmp/candidate.pdf
            CODE=$(curl -sSL -A "$UA" -H 'Accept: application/pdf,*/*' -o /tmp/candidate.pdf -w '%{http_code}' --max-time 120 "$URL")
            SIZE=$(stat -c%s /tmp/candidate.pdf 2>/dev/null || echo 0)
            TYPE=$(file -b --mime-type /tmp/candidate.pdf 2>/dev/null || echo unknown)
            echo "url=$URL http=$CODE bytes=$SIZE type=$TYPE"
            if [ "$CODE" = "200" ] && [ "$TYPE" = "application/pdf" ] && [ "$SIZE" -gt 1000000 ]; then
              echo "sha256=$(sha256sum /tmp/candidate.pdf | cut -d' ' -f1)"
              echo "pages=$(pdfinfo /tmp/candidate.pdf 2>/dev/null | awk '/^Pages:/{print $2}')"
              echo "title=$(pdfinfo /tmp/candidate.pdf 2>/dev/null | sed -n 's/^Title:[[:space:]]*//p')"
              pdftotext -layout /tmp/candidate.pdf /tmp/candidate.txt || true
              echo "--- pages mentioning preference ---"
              awk 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {if (tolower($0) ~ /preference/) printf "p%d: %s\n", p, $0}' /tmp/candidate.txt | sed 's/[[:space:]]\+$//' | head -60
              echo "--- pages mentioning 'only one class' ---"
              awk 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {if (tolower($0) ~ /only one class/) printf "p%d: %s\n", p, $0}' /tmp/candidate.txt | sed 's/[[:space:]]\+$//' | head -20
            fi
          done

          echo
          echo "===== END OF REPORT ====="
          exec >&3 2>&3
          echo "report bytes=$(stat -c%s "$REPORT")"

      - name: Publish report to the branch (temp path)
        if: always()
        run: |
          set -u
          REPORT=/tmp/l038-report.txt
          [ -s "$REPORT" ] || { echo "no report captured"; exit 0; }
          mkdir -p .l038-temp
          cp "$REPORT" .l038-temp/preference-locator-report.txt
          git config user.name "L-038 locator"
          git config user.email "noreply@github.com"
          git add .l038-temp/preference-locator-report.txt
          git commit -qm "temp: L-038 preference locator report (throwaway, deleted before PR)"
          git push origin HEAD:refs/heads/arena/39e78147-iips-review-recovered
