name: temp L-038 latest-report locator (throwaway — deleted before PR)

# THROWAWAY. Part 3 of the L-038 preference-capital retrieval (runner-side; the sandbox has no egress).
# Already settled: FY2023-24 (sha256 03cb0db7...7595, 259 pp; p.190 = "12(b) Reserves & surplus") and
# FY2024-25 (sha256 74e0f6c2...3474, 255 pp). Both consolidated Note 12(a) show authorised preference capital
# of 7 crore shares / Rs. 65 crore and an issued-capital section made up only of equity shares, with no class
# or nil statement anywhere in either document.
#
# Part 3 answers the remaining question — is a STILL LATER audited consolidated report published (FY2025-26
# would be due around July 2026)? — and captures the verbatim remainder of the FY25 share-capital note plus the
# historical preference-share rows, so the record is complete rather than abbreviated.
# Output is committed to a temp path on the same branch; workflow and temp path are removed before the PR.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-l038-preference-locate.yml'

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/39e78147-iips-review-recovered

      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils curl >/dev/null

      - name: Collect evidence into /tmp/l038-report5.txt
        run: |
          set -u
          REPORT=/tmp/l038-report5.txt
          : > "$REPORT"
          exec 3>&1
          exec >> "$REPORT" 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          echo "===== FY2025-26 annual report — standalone share-capital note and capital-history rows ====="
          curl -sSL -A "$UA" -H 'Accept: application/pdf,*/*' --max-time 600 -o /tmp/f26.pdf "https://marico.com/investorspdf/Marico_Annual_Report_FY26.pdf"
          echo "bytes=$(stat -c%s /tmp/f26.pdf) sha256=$(sha256sum /tmp/f26.pdf | cut -d' ' -f1) pages=$(pdfinfo /tmp/f26.pdf | awk '/^Pages:/{print $2}')"
          echo "expect 21282741 / 7ea5e097b415f4fa226d32cad95cdc6435a88c58e43c2db10d4de7b31103ec4f / 279"
          for pg in 250 251 275; do
            echo "=== BEGIN FY26 PAGE $pg ==="
            pdftotext -layout -f "$pg" -l "$pg" /tmp/f26.pdf - | sed 's/[[:space:]]\+$//'
            echo "=== END FY26 PAGE $pg ==="
          done
          echo "===== END OF REPORT ====="
          exec >&3 2>&3
          echo "report bytes=$(stat -c%s "$REPORT")"

      - name: Publish report to the branch (temp path)
        if: always()
        run: |
          set -u
          REPORT=/tmp/l038-report5.txt
          [ -s "$REPORT" ] || { echo "no report captured"; exit 0; }
          mkdir -p .l038-temp
          cp "$REPORT" .l038-temp/fy26-standalone-report.txt
          git config user.name "L-038 locator"
          git config user.email "noreply@github.com"
          git add .l038-temp/fy26-standalone-report.txt
          git commit -qm "temp: L-038 FY26 standalone pages (throwaway, deleted before PR)"
          git push origin HEAD:refs/heads/arena/39e78147-iips-review-recovered
