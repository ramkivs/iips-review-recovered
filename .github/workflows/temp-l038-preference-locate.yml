name: temp L-038 preference-share locator (throwaway — deleted before PR)

# One-off retrieval for the L-038 preference-capital question. It does two things on a runner that can
# reach the issuer host (the sandbox cannot):
#   1. re-verify the FY2023-24 consolidated report's identity (bytes + sha256) and locate EVERY page of it
#      that mentions "preference", so the share-capital note's structure (12(a), 12(b), 12(c)) is mapped
#      rather than guessed;
#   2. probe whether a LATER audited consolidated annual report is published at the same host, and if so
#      identify it (bytes, sha256, pages) and locate every "preference" mention in it.
# Nothing is written to the repository; the output is the run log. The workflow is removed before the PR.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/temp-l038-preference-locate.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils curl >/dev/null

      - name: FY2023-24 report — identity and every page that mentions "preference"
        run: |
          set -euo pipefail
          URL="https://marico.com/investorspdf/Marico_Annual_Report_FY24.pdf"
          curl -sSL --max-time 180 -o /tmp/fy24.pdf "$URL"
          echo "url=$URL"
          echo "bytes=$(stat -c%s /tmp/fy24.pdf)"
          echo "sha256=$(sha256sum /tmp/fy24.pdf | cut -d' ' -f1)"
          echo "pages=$(pdfinfo /tmp/fy24.pdf | awk '/^Pages:/{print $2}')"
          pdftotext -layout /tmp/fy24.pdf /tmp/fy24.txt
          echo "----- pages mentioning preference (case-insensitive) -----"
          awk 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {if (tolower($0) ~ /preference/) printf "p%d: %s\n", p, $0}' /tmp/fy24.txt | sed 's/[[:space:]]\+$//' | head -80
          echo "----- PDF page 190 of 259, verbatim -layout -----"
          echo "=== BEGIN PAGE 190 ==="
          pdftotext -layout -f 190 -l 190 /tmp/fy24.pdf - | sed 's/[[:space:]]\+$//'
          echo "=== END PAGE 190 ==="
          echo "----- PDF page 189 and 191, first 40 lines each (context) -----"
          echo "=== BEGIN PAGE 189 (head) ==="
          pdftotext -layout -f 189 -l 189 /tmp/fy24.pdf - | sed 's/[[:space:]]\+$//' | head -40
          echo "=== END PAGE 189 ==="
          echo "=== BEGIN PAGE 191 (head) ==="
          pdftotext -layout -f 191 -l 191 /tmp/fy24.pdf - | sed 's/[[:space:]]\+$//' | head -25
          echo "=== END PAGE 191 ==="

      - name: Later audited annual report — is one published?
        run: |
          set -uo pipefail
          for URL in \
            "https://marico.com/investorspdf/Marico_Annual_Report_FY25.pdf" \
            "https://marico.com/investorspdf/Marico_Annual_Report_FY2024-25.pdf" \
            "https://marico.com/investorspdf/Marico_Integrated_Annual_Report_2024-25.pdf" \
            "https://marico.com/investorspdf/Marico_Annual_Report_2024-25.pdf"
          do
            CODE=$(curl -sSL -o /tmp/candidate.pdf -w '%{http_code}' --max-time 180 "$URL" || echo "000")
            SIZE=$(stat -c%s /tmp/candidate.pdf 2>/dev/null || echo 0)
            TYPE=$(file -b --mime-type /tmp/candidate.pdf 2>/dev/null || echo unknown)
            echo "url=$URL http=$CODE bytes=$SIZE type=$TYPE"
            if [ "$CODE" = "200" ] && [ "$TYPE" = "application/pdf" ] && [ "$SIZE" -gt 1000000 ]; then
              echo "sha256=$(sha256sum /tmp/candidate.pdf | cut -d' ' -f1)"
              echo "pages=$(pdfinfo /tmp/candidate.pdf | awk '/^Pages:/{print $2}')"
              echo "title=$(pdfinfo /tmp/candidate.pdf | sed -n 's/^Title:[[:space:]]*//p')"
              pdftotext -layout /tmp/candidate.pdf /tmp/candidate.txt
              echo "----- pages mentioning preference (case-insensitive) -----"
              awk 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {if (tolower($0) ~ /preference/) printf "p%d: %s\n", p, $0}' /tmp/candidate.txt | sed 's/[[:space:]]\+$//' | head -80
              echo "----- pages mentioning 'only one class' -----"
              awk 'BEGIN{p=1} {if (index($0,"\f")>0) p++} {if (tolower($0) ~ /only one class/) printf "p%d: %s\n", p, $0}' /tmp/candidate.txt | sed 's/[[:space:]]\+$//' | head -20
              cp /tmp/candidate.txt /tmp/later.txt || true
            fi
          done
