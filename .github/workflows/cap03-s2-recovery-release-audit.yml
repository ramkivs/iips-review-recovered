name: CAP-03 S2 recovery release asset audit

on:
  pull_request:
    paths:
      - '.github/workflows/cap03-s2-recovery-release-audit.yml'
      - 'docs/integration/cap03-p1-f9/verify_cap03_s2_recovery_release.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-release:
    name: Download release assets and verify original 1,140 hashes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out IRR only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and independently verify the published recovery assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python docs/integration/cap03-p1-f9/verify_cap03_s2_recovery_release.py
