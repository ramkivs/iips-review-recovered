name: L-038 temporary debt-disclosure discovery (throwaway)

# THROWAWAY. Exists only to read the two Marico annual reports from a GitHub-hosted runner, because marico.com is
# not reachable from the development sandbox. It downloads the PDFs, identifies them by sha256, searches every page
# for the borrowing / maturity / net-debt / preference captions, and commits the matching pages and a hit report
# into a scratch directory on this branch so the IRR session can read them (artifact downloads are not reachable
# from the sandbox). The scratch directory and this workflow are deleted before the pull request.

on:
  push:
    paths:
      - '.github/workflows/temp-l038-discover.yml'

permissions:
  contents: write

jobs:
  discover:
    name: Fetch and search both annual reports for the debt captions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Fetch the two annual reports, recording every HTTP outcome
        run: |
          set -uo pipefail
          mkdir -p out/pages
          : > out/fetch-log.txt
          fetch() {
            local name="$1"; shift
            for url in "$@"; do
              code=$(curl -sSL --retry 2 --max-time 240 -A 'Mozilla/5.0 (compatible; IIPS-IRR-evidence/1.0)' \
                       -o "$name.tmp" -w '%{http_code}' "$url" || echo 'curl-error')
              size=$(stat -c %s "$name.tmp" 2>/dev/null || echo 0)
              kind=$(file -b "$name.tmp" 2>/dev/null || echo 'no-file')
              echo "$name | $url | http=$code | bytes=$size | $kind" >> out/fetch-log.txt
              if [ "$code" = "200" ] && [ "$size" -gt 1000000 ]; then mv "$name.tmp" "$name"; return 0; fi
              rm -f "$name.tmp"
            done
            return 1
          }
          fetch fy24.pdf \
            https://marico.com/investorspdf/Marico_Annual_Report_FY24.pdf \
            https://www.marico.com/investorspdf/Marico_Annual_Report_FY24.pdf
          fetch fy23.pdf \
            https://marico.com/investorspdf/Marico_Annual_Report_FY23.pdf \
            https://www.marico.com/investorspdf/Marico_Annual_Report_FY23.pdf
          {
            echo "## fetch log"
            cat out/fetch-log.txt
            for f in fy24.pdf fy23.pdf; do
              if [ -s "$f" ]; then
                echo "## $f"
                sha256sum "$f"
                wc -c < "$f"
                pdfinfo "$f" | grep -E '^(Pages|Title|CreationDate)'
              else
                echo "## $f MISSING"
              fi
            done
          } | tee out/source-identity.txt
          exit 0

      - name: Search every page for the debt, maturity, net-debt and preference captions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, unicodedata
          from pathlib import Path

          out = Path('out')
          (out / 'pages').mkdir(parents=True, exist_ok=True)

          docs = {k: v for k, v in {'fy24': ('fy24.pdf', 'Marico_Annual_Report_FY24.pdf'),
                                    'fy23': ('fy23.pdf', 'Marico_Annual_Report_FY23.pdf')}.items()
                  if Path(v[0]).exists()}
          if not docs:
              Path('out/hits.txt').write_text('no report could be fetched; see fetch-log.txt\n')
              raise SystemExit(0)

          patterns = {
              'current_maturities': r'current\s+maturit',
              'maturities': r'maturit',
              'scheduled': r'scheduled\s+maturity',
              'long_term_borrow': r'long[\s-]*term\s+borrow',
              'short_term_borrow': r'short[\s-]*term\s+borrow',
              'borrowings': r'borrowings?',
              'net_debt': r'net\s+debt',
              'net_cash': r'net\s+cash',
              'preference': r'preference\s+share',
              'debenture': r'debenture',
              'lease_liabilit': r'lease\s+liabilit',
              'note_13': r'note\s*13\b',
          }

          def page_text(pdf, page):
              return subprocess.run(['pdftotext', '-layout', '-f', str(page), '-l', str(page), pdf, '-'],
                                    capture_output=True, text=True).stdout

          report = []
          keep = set()
          for key, (pdf, name) in docs.items():
              pages = int(re.search(r'Pages:\s+(\d+)',
                          subprocess.run(['pdfinfo', pdf], capture_output=True, text=True, check=True).stdout).group(1))
              report.append(f'== {key} {name} ({pages} pages)')
              for page in range(1, pages + 1):
                  flat = unicodedata.normalize('NFKC', page_text(pdf, page))
                  hits = {k: len(re.findall(p, flat, flags=re.I)) for k, p in patterns.items()}
                  if hits['current_maturities'] or hits['scheduled']:
                      keep.add((key, page))
                      report.append(f'{key} p{page}: ' + ', '.join(f'{k}={hits[k]}' for k in hits if hits[k])
                                    + '  [MATURITY-SCHEDULE PAGE KEPT]')
                  elif hits['net_debt'] or hits['net_cash'] or hits['preference'] or hits['debenture']:
                      report.append(f'{key} p{page}: ' + ', '.join(f'{k}={hits[k]}' for k in hits if hits[k]))
                      if hits['net_debt'] or hits['net_cash']:
                          keep.add((key, page))
                  elif hits['maturities']:
                      report.append(f'{key} p{page}: ' + ', '.join(f'{k}={hits[k]}' for k in hits if hits[k]))
              # keep every page whose running head is the borrowings note (13(a) / 13(b) / 13)
              for page in range(1, pages + 1):
                  flat = unicodedata.normalize('NFKC', page_text(pdf, page))
                  if re.search(r'(?i)13\(a\)\s*borrowings|13\(a\)\s*borrowings', flat) or \
                     re.search(r'(?i)(non[\s-]*current|current)\s+borrowings', flat):
                      keep.add((key, page))
              # keep the consolidated balance sheet and the cash-flow statement
              for page in range(1, pages + 1):
                  flat = unicodedata.normalize('NFKC', page_text(pdf, page))
                  if re.search(r'(?i)consolidated\s+balance\s+sheet', flat) or \
                     re.search(r'(?i)consolidated\s+statement\s+of\s+cash\s+flow', flat):
                      keep.add((key, page))

          for key, page in sorted(keep):
              pdf = docs[key][0]
              (out / 'pages' / f'{key}-p{page:03d}.txt').write_text(page_text(pdf, page), encoding='utf-8')
          (out / 'hits.txt').write_text('\n'.join(report) + '\n\nPAGES KEPT\n' +
                                        '\n'.join(f'{k}-p{p:03d}' for k, p in sorted(keep)) + '\n', encoding='utf-8')
          print('\n'.join(report))
          print(f'{len(keep)} pages kept')
          PY

      - name: Commit what was read into the scratch directory on this branch
        if: always()
        run: |
          set -euo pipefail
          dest=evidence/real-issuer/WI7-L038-DEBT-COMPLETENESS-2026-11-07/_discovery
          git init -q scratch
          cd scratch
          git config user.name "IIPS IRR (discovery runner)"
          git config user.email "iips-irr@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD
          mkdir -p "$dest"
          cp -r ../out/source-identity.txt ../out/fetch-log.txt "$dest/" 2>/dev/null || true
          cp -r ../out/hits.txt "$dest/" 2>/dev/null || true
          rm -rf "$dest/pages"
          if [ -d ../out/pages ]; then cp -r ../out/pages "$dest/pages"; fi
          git add "$dest"
          git -c user.name="IIPS IRR (discovery runner)" -c user.email="iips-irr@users.noreply.github.com" \
              commit -q -m "L-038 discovery: debt/maturity page extracts and hit report (scratch, to be deleted)"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
